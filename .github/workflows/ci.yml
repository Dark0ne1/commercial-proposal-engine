name: Verify
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: proposal
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: proposal_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U proposal -d proposal_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://proposal:test-only-password@localhost:5432/proposal_test
      TEST_DATABASE_URL: postgresql+psycopg://proposal:test-only-password@localhost:5432/proposal_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libreoffice-writer fonts-dejavu
      - run: pip install -r backend/requirements.txt
      - run: ruff check backend && ruff format --check backend
      - run: cd backend && alembic upgrade head && alembic downgrade base && alembic upgrade head && pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck && npm run build && npm audit --audit-level=high
  compose-e2e:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-db-password-123
      DEMO_PASSWORD: demo-password-123
      PUBLIC_ORIGIN: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: docker compose up -d --build --wait --wait-timeout 300
      - run: docker compose exec -T api python seed.py
      - run: cd frontend && npm ci && npx playwright install --with-deps chrome && npm run test:e2e
      - if: always()
        run: docker compose logs --no-color > compose.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-evidence
          path: |
            compose.log
            output/
            frontend/test-results/
      - if: always()
        run: docker compose down
